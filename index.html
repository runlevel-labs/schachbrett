<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Schachbrett</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#edf1f6">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<main class="workspace">
  <div class="board-area">
    <div id="board" aria-label="Schachbrett" role="grid"></div>
    <section id="setupPanel" aria-labelledby="setupTitle" hidden>
      <h2 id="setupTitle">Schachaufgabe aufbauen</h2>
      <p>Figur wählen und ein Feld anklicken. Mit „Entfernen“ löschst du einzelne Figuren.</p>
      <div id="setupPieces"></div>
      <div class="actions setup-actions">
        <button id="setupErase" class="btn" type="button" aria-pressed="false">Entfernen</button>
        <label for="setupTurn">Am Zug</label>
        <select id="setupTurn">
          <option value="w">Weiß</option>
          <option value="b">Schwarz</option>
        </select>
      </div>
      <p id="setupError" role="alert"></p>
      <div class="actions setup-actions">
        <button id="setupApply" class="btn primary" type="button">Stellung übernehmen</button>
        <button id="setupCancel" class="btn" type="button">Abbrechen</button>
      </div>
    </section>
    <div id="replayControls" class="replay-controls" role="group" aria-label="PGN-Wiedergabe" hidden>
      <button id="rFirst" class="btn" type="button" aria-label="Zur Startstellung" title="Zur Startstellung" disabled>⏮</button>
      <button id="rPrev" class="btn" type="button" aria-label="Vorheriger Zug" title="Vorheriger Zug" disabled>◀</button>
      <button id="rNext" class="btn" type="button" aria-label="Nächster Zug" title="Nächster Zug" disabled>▶</button>
      <button id="rLast" class="btn" type="button" aria-label="Zum Partieende" title="Zum Partieende" disabled>⏭</button>
      <button id="rAuto" class="btn" type="button" disabled>⏵ Auto</button>
      <span id="rPos" class="replay-count" aria-live="polite">0 / 0</span>
    </div>
    <div id="trainingControls" class="replay-controls" role="group" aria-label="Aufgabensteuerung" hidden>
      <button id="trainingRestart" class="btn" type="button">Nochmal versuchen</button>
      <button id="trainingReveal" class="btn" type="button">Lösung anzeigen</button>
    </div>
  </div>

  <aside class="bar" aria-labelledby="panel-title">
    <header class="panel-header">
      <h1 id="panel-title">Schachbrett</h1>
      <button id="undo" class="btn" type="button" disabled>Rückgängig</button>
    </header>

    <div class="position-line">
      <div id="status" aria-live="polite">Weiß am Zug.</div>
      <span class="move-number">Zug <b id="moveno">1</b></span>
    </div>

    <div class="clocks" aria-label="Schachuhr" role="group">
      <div class="clockrow" aria-current="true"><span>Weiß</span><b id="wtime">2:00:00</b></div>
      <div class="clockrow" aria-current="false"><span>Schwarz</span><b id="btime">2:00:00</b></div>
    </div>
    <div class="actions clock-actions">
      <button id="clockToggle" class="btn primary" type="button">Uhr starten</button>
      <button id="clockReset" class="btn" type="button">Uhr zurücksetzen</button>
    </div>

    <section id="movePanel" class="panel-section" aria-labelledby="moves-title">
      <div class="section-header">
        <h2 id="moves-title">Züge</h2>
        <button id="clearmoves" class="btn quiet" type="button" disabled>Liste leeren</button>
      </div>
      <p id="emptyMoves">Noch keine Züge</p>
      <ol id="moves" aria-labelledby="moves-title" role="list" hidden></ol>
    </section>

    <div class="panel-section">
      <div class="actions">
        <div class="actions" role="group" aria-label="PGN-Datei">
          <button id="pgnLoad" class="btn" type="button">PGN laden</button>
          <input id="pgnfile" type="file" accept=".pgn" aria-label="PGN-Datei laden" hidden />
          <button id="pgn" class="btn" type="button" aria-label="PGN exportieren">Exportieren</button>
        </div>
        <div class="actions" role="group" aria-label="Stellungsbewertung">
          <button id="engToggle" class="btn" type="button" aria-pressed="false">Engine: AUS</button>
          <span id="engScore" class="pill" aria-live="polite">–</span>
          <span id="engState" aria-live="polite" hidden>aus</span>
        </div>
        <button id="trainingToggle" class="btn" type="button" aria-pressed="false">Aufgabenmodus</button>
      </div>
      <div id="pgnCollection" class="actions collection-actions" role="group" aria-label="PGN-Sammlung" hidden>
        <button id="pgnPrevious" class="btn" type="button" aria-label="Vorherige Partie">‹</button>
        <form id="pgnJump" class="actions">
          <label for="pgnNumber">Partie</label>
          <input id="pgnNumber" type="number" min="1" step="1" required aria-describedby="pgnCount">
          <span id="pgnCount"></span>
          <button class="btn" type="submit">Öffnen</button>
        </form>
        <button id="pgnNext" class="btn" type="button" aria-label="Nächste Partie">›</button>
      </div>
      <p id="pgnError" role="alert"></p>
    </div>

    <details id="boardActions" class="panel-section board-actions">
      <summary>Brettaktionen</summary>
      <div class="actions">
        <button id="reset" class="btn" type="button">Startaufstellung</button>
        <button id="clear" class="btn" type="button">Brett leeren</button>
      </div>
    </details>
  </aside>
</main>


<dialog id="promotion" aria-labelledby="promotion-title">
  <form>
    <h2 id="promotion-title">Bauernumwandlung</h2>
    <div class="promotion-options">
      <button class="btn" type="submit" value="q" autofocus>Dame</button>
      <button class="btn" type="submit" value="r">Turm</button>
      <button class="btn" type="submit" value="b">Läufer</button>
      <button class="btn" type="submit" value="n">Springer</button>
    </div>
    <button class="btn" type="submit" value="">Abbrechen</button>
  </form>
</dialog>

<script src="vendor/chess.js"></script>
<script src="main.js"></script>

</body>
</html>
